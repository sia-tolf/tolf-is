name: TOLF Passkey label one-time patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run TOLF Passkey label patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Passkey label helper before account state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<script defer src="app.js?v=account-auth-20260917-1"></script>'
          helper = '<script defer src="passkey-session-label.20260917-1.js"></script>'
          if helper not in s:
              s = s.replace(marker, helper + '\n' + marker, 1)
          p.write_text(s)
          PY
          git config user.name sia-tolf
          git config user.email tolf@velbnk.is
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Load current Passkey label on TOLF home"
            git push
          fi
